<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Flappy Dash</title>
<style>
  :root { --bg:#0b0b1a; --accent:#22d3ee; --pink:#f472b6; --text:#e8e8ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif; overflow:hidden; touch-action:manipulation; }
  #wrap { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; }
  canvas { width:100%; height:100%; display:block; border-radius:10px; box-shadow:0 0 40px #22d3ee33; }
  .panel { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:#0b0b1ad9; border-radius:10px; text-align:center; padding:16px; }
  .panel.hidden { display:none; }
  h1 { margin:0; font-size:clamp(28px,6vw,56px); letter-spacing:2px;
    background:linear-gradient(90deg,var(--accent),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { margin:0; opacity:.8; font-size:clamp(12px,2vw,16px); max-width:520px; line-height:1.4; }
  .levels { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  button { font:inherit; font-weight:700; color:var(--text); background:#1c1c3a; border:2px solid var(--accent);
    border-radius:12px; padding:10px 16px; cursor:pointer; min-width:130px; transition:transform .1s, background .15s; }
  button:hover:not(:disabled) { background:#26265a; transform:translateY(-2px); }
  button:disabled { opacity:.35; border-color:#556; cursor:not-allowed; }
  button small { display:block; font-weight:400; opacity:.7; font-size:.75em; }
  button.primary { background:var(--accent); color:#06222a; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="800" height="450"></canvas>
  <div id="menu" class="panel">
    <h1>FLAPPY DASH</h1>
    <p>Run as a cube and jump the spikes. Hit a portal and you turn into a bird &mdash; flap through the pipes.
       Tap, click or press <b>Space / &uarr;</b>. Hold to keep jumping, tap to flap.</p>
    <div class="levels" id="levels"></div>
  </div>
  <div id="over" class="panel hidden">
    <h1 id="overTitle">Level Complete!</h1>
    <p id="overText"></p>
    <div class="levels">
      <button id="btnNext" class="primary">Next level</button>
      <button id="btnRetry">Retry</button>
      <button id="btnMenu">Levels</button>
    </div>
  </div>
</div></div>
<script src="game.js"></script>
</body>
</html>
